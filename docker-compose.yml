# `docker compose up` serves the game on http://localhost:8080 out of the box.
#
# For a real deployment behind Traefik, set the domain and switch the network on:
#
#   1. echo "DOMAIN=panelaak.shelfy.cz" >> .env      # or export DOMAIN=…
#   2. uncomment the two `networks:` blocks below (service + top level)
#   3. drop the `ports:` mapping on panelak (Traefik reaches it over the network)
#
# nginx inside the panelak image already proxies /api/ to the api service, so
# the game and the leaderboard share one origin — no CORS, one certificate.
# The api service also gets its own hostname (api.$DOMAIN) for clients that
# can't use a relative path: a desktop build loading from file://, or the
# GitHub Pages copy. Both routes reach the same container.

services:
  panelak:
    build: .
    image: panelak-tycoon:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.panelak.rule=Host(`${DOMAIN:-panelaak.shelfy.cz}`)"
      - "traefik.http.routers.panelak.entrypoints=websecure"
      - "traefik.http.routers.panelak.tls.certresolver=letsencrypt"
      - "traefik.http.services.panelak.loadbalancer.server.port=80"
    # Uncomment to join an existing Traefik network (and drop the ports above):
    # networks:
    #   - web

  # Leaderboard API. nginx (in the panelak image) proxies /api/ here, and
  # Traefik also publishes it directly on api.$DOMAIN.
  api:
    build: ./server
    image: panelak-leaderboard:latest
    restart: unless-stopped
    environment:
      - PORT=3001
      - DB_PATH=/data/leaderboard.db
      # Leave unset to answer any origin (public vanity board, no cookies).
      # Set a comma-separated allowlist to narrow it — remember that a desktop
      # build sends `Origin: null`, so include that if you lock this down.
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - leaderboard-data:/data
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.panelak-api.rule=Host(`api.${DOMAIN:-panelaak.shelfy.cz}`)"
      - "traefik.http.routers.panelak-api.entrypoints=websecure"
      - "traefik.http.routers.panelak-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.panelak-api.loadbalancer.server.port=3001"
    # networks:
    #   - web

volumes:
  leaderboard-data:

