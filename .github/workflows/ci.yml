name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # itch.io-ready web build (HTML5 upload) — grab it from the run artifacts
      - run: cd dist && zip -r ../panelak-tycoon-web.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: panelak-tycoon-web
          path: panelak-tycoon-web.zip

      # --- Publish to itch.io via butler (template) --------------------------
      # Set the BUTLER_API_KEY secret and uncomment:
      # - uses: manleydev/butler-publish-itchio-action@master
      #   env:
      #     BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
      #     CHANNEL: html5
      #     ITCH_GAME: panelak-tycoon
      #     ITCH_USER: smeglofus
      #     PACKAGE: panelak-tycoon-web.zip

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t panelak-tycoon:ci .

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

      # --- Push to a registry (template, spec §9) ---------------------------
      # Uncomment and set the secrets to publish images:
      #
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      # - name: Push
      #   run: |
      #     docker tag panelak-tycoon:ci ghcr.io/${{ github.repository }}:latest
      #     docker push ghcr.io/${{ github.repository }}:latest
